name: ci-api

on:
  push:
    branches: [main]
    paths: ['api/**', '.github/workflows/ci-api.yml']
  pull_request:
    branches: [main]
    paths: ['api/**', '.github/workflows/ci-api.yml']

defaults:
  run:
    working-directory: ./api

jobs:
  ci-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test
        run: go test ./...
